spring:
  application:
    name: cto-project-tracker-backend

  # Veritabani PostgreSQL. Varsayilanlar docker-compose.yml'deki gelistirme veritabanini gosterir
  # (docker compose up -d db). Baska bir ortamda DB_HOST, DB_PORT, DB_NAME, DB_USER,
  # DB_PASSWORD ortam degiskenleriyle degistirilir.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ctotracker}
    username: ${DB_USER:ctotracker}
    password: ${DB_PASSWORD:ctotracker_dev}

  # Semayi Flyway yonetir (src/main/resources/db/migration).
  flyway:
    enabled: true

  jpa:
    hibernate:
      # Hibernate semayi degistirmez; yalnizca entity'lerin Flyway semasiyla uyustugunu dogrular.
      ddl-auto: validate
    # SQL loglari gerektiginde: logging.level.org.hibernate.SQL=DEBUG
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    # Hatalar GlobalExceptionHandler uzerinden tek formatta donuyor;
    # Spring'in varsayilan /error govdesi devre disi kalsin.
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.kolaysoft.ctotracker: DEBUG
