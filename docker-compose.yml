# Gelistirme ortami: PostgreSQL (db) ve istege bagli olarak uygulamanin kendisi (app).
# Kullanim:
#   cp .env.example .env          (istege bagli; degerlerin hepsinin varsayilani var)
#   docker compose up -d db       (yalnizca veritabani; uygulama: cd backend && ./mvnw spring-boot:run)
#   docker compose up -d --build  (veritabani + uygulama, http://localhost:8080)
#   docker compose down           (veri volume'da kalir; silmek icin: docker compose down -v)
# Proje adi sabit: volume ve ag adlari klasor adina bagli kalmasin (or. repo baska adla klonlansa da).
name: cto-project-tracker

services:
  db:
    image: postgres:17-alpine
    container_name: ctotracker-db
    environment:
      POSTGRES_DB: ${DB_NAME:-ctotracker}
      POSTGRES_USER: ${DB_USER:-ctotracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ctotracker_dev}
    ports:
      # Makinede yerel bir PostgreSQL 5432'yi kullanabildigi icin varsayilan 5433.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ctotracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    image: cto-tracker:latest
    container_name: ctotracker-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Compose agi icinde veritabanina servis adiyla ve konteyner ici portla (5432) ulasilir.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ctotracker}
      DB_USER: ${DB_USER:-ctotracker}
      DB_PASSWORD: ${DB_PASSWORD:-ctotracker_dev}
      # Bos birakilirsa varsayilan profil (demo) calisir; ornek veri istenmiyorsa: prod
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # API'ye tarayicidan erisebilecek frontend adresleri (virgulle ayrilmis)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  ctotracker-db-data:
