# Frontend konteyneri: derlenmis uygulamayi sunar, /api isteklerini backend konteynerine iletir.
server {
    listen 80;
    root /usr/share/nginx/html;
    # Hata sayfalarinda ve basliklarda nginx surumu gorunmez.
    server_tokens off;

    # API: compose agindaki backend servisine (app:8080). Host basligi portuyla birlikte gecer; backend
    # istegi ayni adresten gelmis sayar (CORS on kontrolu gerekmez).
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite dosya adlarina icerik ozeti ekler (index-DJHBLK6p.js): degisen dosyanin adi da degisir,
    # bu yuzden uzun sure onbellekte tutulabilir.
    # Not: bir location kendi add_header'ini tanimlayinca server duzeyindeki basliklar ona gecmez; guvenlik
    # basliklari bu yuzden her location'a ayri ayri eklenir. API yanitlarinin basliklarini backend (Spring
    # Security) yazar.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Tek sayfa uygulama: /projects/3 gibi adresler de index.html'e duser, yolu React Router cozer.
    # index.html onbellege alinmaz; yeni surum yayinlaninca tarayici yeni dosya adlarini gorur.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
