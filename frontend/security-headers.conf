# Sayfa ve statik dosyalarin guvenlik basliklari (nginx.conf'taki her location'a eklenir).
#
# CSP: betik, baglanti ve font yalnizca ayni adresten; satir ici betik yok (index.html yalnizca /assets'teki
# modulu yukler). Mantine ve Recharts satir ici stil kullandigi icin style-src 'unsafe-inline' gerekir. Excel
# indirme blob: adresi kullanir; indirme bir gezinme oldugu icin CSP onu engellemez.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Baska bir site sayfayi cerceve icinde acamaz (tiklama tuzagi).
add_header X-Frame-Options "DENY" always;
# Tarayici dosya turunu tahmin etmez.
add_header X-Content-Type-Options "nosniff" always;
# Baska sitelere giden isteklerde tam adres (ve icindeki filtre/kayit bilgisi) gonderilmez.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Kullanilmayan tarayici ozellikleri kapali.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HTTPS ile yayinlanirken eklenecek (HTTP'de anlamsiz, yanlis yerde tarayiciyi kilitler):
# add_header Strict-Transport-Security "max-age=31536000" always;
