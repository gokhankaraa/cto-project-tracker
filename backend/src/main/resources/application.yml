spring:
  application:
    name: cto-project-tracker-backend

  # Bu dosya uretim icin guvenli temeldir: profil secilmezse ornek veri yuklenmez, JWT_SECRET zorunludur, ilk admin
  # ADMIN_EMAIL / ADMIN_PASSWORD ile olusturulur (AdminBootstrap), Swagger kapalidir. Yerel gelistirme kolayliklari
  # (ornek veri, gelistirme sirri, DEBUG log, Swagger) yalnizca "demo" profilindedir: application-demo.yml.

  # Veritabani PostgreSQL. Varsayilanlar docker-compose.yml'deki gelistirme veritabanini gosterir
  # (docker compose up -d db). Baska bir ortamda DB_HOST, DB_PORT, DB_NAME, DB_USER,
  # DB_PASSWORD ortam degiskenleriyle degistirilir.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ctotracker}
    username: ${DB_USER:ctotracker}
    password: ${DB_PASSWORD:ctotracker_dev}

  # Semayi Flyway yonetir (src/main/resources/db/migration).
  flyway:
    enabled: true

  jpa:
    hibernate:
      # Hibernate semayi degistirmez; yalnizca entity'lerin Flyway semasiyla uyustugunu dogrular.
      ddl-auto: validate
    # SQL loglari gerektiginde: logging.level.org.hibernate.SQL=DEBUG
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  error:
    # Hatalar GlobalExceptionHandler uzerinden tek formatta donuyor;
    # Spring'in varsayilan /error govdesi devre disi kalsin.
    include-message: never
    include-stacktrace: never

# Frontend'in tarayicidan API'ye erisebilecegi adresler (CORS, bkz. CorsConfig). Virgulle birden cok
# adres verilebilir; varsayilan Vite gelistirme sunucusu.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Giris token'i (JWT, HS256). JWT_SECRET en az 32 baytlik rastgele bir deger olmalidir (or. openssl rand -base64 48);
  # verilmezse uygulama baslamaz. Sir degisirse onceden verilen tum token'lar gecersiz olur.
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-ttl: ${JWT_TOKEN_TTL:8h}
  # Ilk admin: veritabaninda hic kullanici yoksa bir kez olusturulur (demo profilinde ornek veri bunu yapar).
  # Kullanici olduktan sonra bu degerler okunmaz; parola sonradan degistirilmez.
  bootstrap:
    enabled: true
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:Sistem Yöneticisi}

# API dokumantasyonu uretimde kapali (demo profilinde acik). Gerekirse SPRINGDOC_API_DOCS_ENABLED=true ve
# SPRINGDOC_SWAGGER_UI_ENABLED=true ile acilir.
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.kolaysoft.ctotracker: INFO
