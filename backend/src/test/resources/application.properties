# Testlere ozel ayarlar; src/main/resources/application.yml'deki degerlerin uzerine yazar.
#
# Testler "test" profiliyle ve bos veritabaniyla baslar; ornek veriye dayanan test sinifi
# @ActiveProfiles("demo") ile bunu acikca ister.
spring.profiles.default=test

# Uretim ayarlari JWT_SECRET ister; testler kendi sirriyla calisir (gelistirme sirri demo disinda reddedilir).
app.auth.jwt-secret=test-only-jwt-secret-for-the-automated-tests-0123456789

# Ilk admin olusturma kapali: testler kendi kullanicilarini olusturur. Davranisi AdminBootstrapTest ve
# ProductionSetupIntegrationTest sinar.
app.bootstrap.enabled=false
